<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MathQuest - Inicio</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=Roboto:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
<main class="quest-container">
  <section class="login-card">
    <header>
      <h1 class="game-title">⚔️ Factorizados</h1>
      <p class="game-subtitle">Inicia sesión o regístrate para continuar tu aventura</p>
    </header>

    <form id="auth-form" class="player-form">
      <input type="email" id="email" class="rpg-input" placeholder="Correo electrónico" required autocomplete="email">
      <input type="password" id="password" class="rpg-input" placeholder="Contraseña (mínimo 6 caracteres)" required autocomplete="current-password" minlength="6">
      <input type="text" id="nickname" class="rpg-input" placeholder="Nickname (solo para registro)" autocomplete="off">

      <div style="display: flex; gap: 10px; margin-top: 10px;">
        <button type="button" id="btn-register" class="rpg-button" style="flex:1;">Registrarse</button>
        <button type="button" id="btn-login" class="rpg-button" style="flex:1; background: linear-gradient(135deg, #64748b, #475569); box-shadow: 0 5px 15px rgba(71,85,105,0.4);">Iniciar sesión</button>
      </div>
    </form>
    
    <div id="error-message" class="error-feedback hidden" aria-live="polite"></div>
  </section>
</main>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="app.js"></script>
</body>
</html>
