<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Matejuegos - Factorizados</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <style>
        /* ESTILOS FORZADOS PARA FACTORIZADOS - PALETA POKÉMON */
        #pregunta-enunciado {
            font-size: 2.4rem !important;
            font-weight: 700 !important;
            color: #1a1a1a !important;
            background: #f7f9fc !important;
            padding: 1.8rem 1rem !important;
            border-radius: 16px !important;
            border: 2px solid #d0dbe8 !important;
            margin-bottom: 1.5rem !important;
            font-family: 'Roboto', 'Segoe UI', Arial, sans-serif !important;
            line-height: 1.4 !important;
            word-break: break-word !important;
            text-align: center !important;
            text-shadow: none !important;
        }

        #opciones-container {
            display: grid !important;
            grid-template-columns: 1fr 1fr !important;
            gap: 1rem !important;
            margin: 1.2rem 0 !important;
        }

        .btn-opcion {
            background: #ffffff !important;
            border: 2px solid #d0dbe8 !important;
            border-radius: 16px !important;
            padding: 1.2rem 0.5rem !important;
            font-size: 1.5rem !important;
            font-weight: 600 !important;
            color: #1a1a1a !important;
            cursor: pointer !important;
            transition: all 0.15s ease !important;
            min-height: 90px !important;
            display: flex !important;
            align-items: center !important;
            justify-content: center !important;
            text-align: center !important;
            font-family: 'Roboto', 'Segoe UI', Arial, sans-serif !important;
            word-break: break-word !important;
            box-shadow: 0 4px 0 #d0dbe8 !important;
        }
        .btn-opcion:hover {
            background: #f0f4fa !important;
            border-color: #3b4cca !important;
            transform: scale(1.02) !important;
        }
        .btn-opcion:active {
            transform: scale(0.97) !important;
        }
        .btn-opcion.opcion-correcta {
            border-color: #2e7d32 !important;
            background: #e8f5e9 !important;
            color: #1a1a1a !important;
        }
        .btn-opcion.opcion-incorrecta {
            border-color: #c62828 !important;
            background: #ffebee !important;
            color: #1a1a1a !important;
        }
        .btn-opcion:disabled {
            opacity: 0.6 !important;
            cursor: not-allowed !important;
        }

        @media (max-width: 400px) {
            #opciones-container {
                grid-template-columns: 1fr !important;
            }
            #pregunta-enunciado {
                font-size: 1.8rem !important;
                padding: 1.2rem 0.8rem !important;
            }
            .btn-opcion {
                font-size: 1.2rem !important;
                min-height: 70px !important;
            }
        }
    </style>
</head>
<body>
    <main class="quest-container">
        <section class="game-card">
            <header class="player-header">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
                    <a href="lobby.html" class="back-button" style="color: #3b4cca; text-decoration: none; font-weight: 600; font-size: 0.9rem;">← Volver</a>
                    <h1 class="game-title" style="font-size: 1.8rem; margin: 0;">🧮 Factorizados</h1>
                    <div style="width: 60px;"></div>
                </div>
                <div class="player-info">
                    <span id="player-name" class="player-name">Aventurero</span>
                    <span class="player-level">Nivel <span id="player-level">1</span></span>
                    <span class="player-coins">🪙 <span id="player-coins">0</span></span>
                </div>
                <div style="display: flex; gap: 8px; justify-content: center; margin: 6px 0 10px 0; flex-wrap: wrap;">
                    <button id="btn-edit-name" class="rpg-button" style="padding: 4px 14px; font-size: 0.75rem; width: auto; background: #f2c94c; color: #1a1a1a;">✏️ Nombre</button>
                    <button id="btn-reiniciar" class="rpg-button" style="padding: 4px 14px; font-size: 0.75rem; width: auto; background: #d32f2f; color: #fff;">🔄 Reiniciar nivel</button>
                    <button id="btn-save" class="rpg-button" style="padding: 4px 14px; font-size: 0.75rem; width: auto; background: #3b4cca; color: #fff;">💾 Guardar</button>
                    <button id="btn-logout" class="rpg-button" style="padding: 4px 14px; font-size: 0.75rem; width: auto; background: #ee1515; color: #fff;">🚪 Salir</button>
                </div>
                <div class="xp-bar">
                    <div id="xp-bar-fill" class="xp-bar-fill" style="width:0%"></div>
                    <span id="xp-text" class="xp-text">0 / 100 XP</span>
                </div>
                <div class="region-info">
                    <span id="player-region">Aldea del Factor Común</span>
                </div>
                <!-- AVATAR -->
                <div id="avatar-display" class="avatar-display"></div>
            </header>

            <div class="question-area">
                <p id="pregunta-enunciado" class="question-text">Cargando pregunta...</p>
                <div id="opciones-container" class="options-container"></div>
                <div id="feedback-message" class="feedback hidden"></div>
                <div class="streak">
                    Racha: <span id="racha-actual">0</span>
                </div>
            </div>
        </section>
    </main>

    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
    <script src="firebase-config.js"></script>
    <script src="common.js"></script>
    <script src="factorizados.js"></script>
</body>
</html>
