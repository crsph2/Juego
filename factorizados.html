<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Matejuegos - Factorizados</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=Roboto:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <style>
        /* ESTILOS FORZADOS PARA FACTORIZADOS */
        /* Asegura que el enunciado sea grande */
        #pregunta-enunciado {
            font-size: 2.4rem !important;
            font-weight: 700 !important;
            color: #f1f5f9 !important;
            background: rgba(15, 23, 42, 0.5) !important;
            padding: 1.8rem 1rem !important;
            border-radius: 12px !important;
            border: 1px solid rgba(251, 191, 36, 0.2) !important;
            margin-bottom: 1.5rem !important;
            font-family: 'Times New Roman', serif !important;
            line-height: 1.4 !important;
            word-break: break-word !important;
            text-align: center !important;
        }

        /* Asegura que las opciones estén en grid 2×2 */
        #opciones-container {
            display: grid !important;
            grid-template-columns: 1fr 1fr !important;
            gap: 1rem !important;
            margin: 1.2rem 0 !important;
        }

        /* Estilo de cada opción */
        .btn-opcion {
            background: rgba(30, 41, 59, 0.7) !important;
            border: 2px solid rgba(148, 163, 184, 0.2) !important;
            border-radius: 14px !important;
            padding: 1.2rem 0.5rem !important;
            font-size: 1.4rem !important;
            font-weight: 600 !important;
            color: #e2e8f0 !important;
            cursor: pointer !important;
            transition: all 0.2s ease !important;
            min-height: 80px !important;
            display: flex !important;
            align-items: center !important;
            justify-content: center !important;
            text-align: center !important;
            font-family: 'Times New Roman', serif !important;
            word-break: break-word !important;
        }
        .btn-opcion:hover {
            background: rgba(251, 191, 36, 0.1) !important;
            border-color: #fbbf24 !important;
            transform: scale(1.02) !important;
        }
        .btn-opcion:active {
            transform: scale(0.97) !important;
        }
        .btn-opcion.opcion-correcta {
            border-color: #22c55e !important;
            background: rgba(34, 197, 94, 0.2) !important;
            color: #86efac !important;
        }
        .btn-opcion.opcion-incorrecta {
            border-color: #ef4444 !important;
            background: rgba(239, 68, 68, 0.2) !important;
            color: #fca5a5 !important;
        }
        .btn-opcion:disabled {
            opacity: 0.7 !important;
            cursor: not-allowed !important;
        }

        /* Ajuste responsive para móviles */
        @media (max-width: 400px) {
            #opciones-container {
                grid-template-columns: 1fr !important;
            }
            #pregunta-enunciado {
                font-size: 1.5rem !important;
                padding: 1.2rem 0.8rem !important;
            }
            .btn-opcion {
                font-size: 1.1rem !important;
                min-height: 60px !important;
            }
        }
    </style>
</head>
<body>
    <main class="quest-container">
        <section class="game-card">
            <header class="player-header">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
                    <a href="lobby.html" class="back-button" style="color: #94a3b8; text-decoration: none; font-size: 0.9rem;">← Volver</a>
                    <h1 class="game-title" style="font-size: 1.8rem; margin: 0;">⚔️ Factorizados</h1>
                    <div style="width: 60px;"></div>
                </div>
                <div class="player-info">
                    <span id="player-name" class="player-name">Aventurero</span>
                    <span class="player-level">Nivel <span id="player-level">1</span></span>
                    <span class="player-coins">🪙 <span id="player-coins">0</span></span>
                </div>
                <div style="display: flex; gap: 8px; justify-content: center; margin: 6px 0 10px 0; flex-wrap: wrap;">
                    <button id="btn-edit-name" class="rpg-button" style="padding: 4px 14px; font-size: 0.75rem; width: auto; background: linear-gradient(135deg, #fbbf24, #b45309);">✏️ Nombre</button>
                    <button id="btn-save" class="rpg-button" style="padding: 4px 14px; font-size: 0.75rem; width: auto; background: linear-gradient(135deg, #22c55e, #15803d); color: #fff;">💾 Guardar</button>
                    <button id="btn-logout" class="rpg-button" style="padding: 4px 14px; font-size: 0.75rem; width: auto; background: linear-gradient(135deg, #ef4444, #b91c1c); color: #fff;">🚪 Salir</button>
                </div>
                <div class="xp-bar">
                    <div id="xp-bar-fill" class="xp-bar-fill" style="width:0%"></div>
                    <span id="xp-text" class="xp-text">0 / 100 XP</span>
                </div>
                <div class="region-info">
                    <span id="player-region">Bosque de la Suma</span>
                </div>
            </header>

            <div class="question-area">
                <p id="pregunta-enunciado" class="question-text">Cargando pregunta...</p>
                <div id="opciones-container" class="options-container"></div>
                <div id="feedback-message" class="feedback hidden"></div>
                <div class="streak">
                    Racha: <span id="racha-actual">0</span>
                </div>
            </div>
        </section>
    </main>

    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
    <script src="firebase-config.js"></script>
    <script src="common.js"></script>
    <script src="factorizados.js"></script>
</body>
</html>
