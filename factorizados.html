<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MathQuest - Factorización</title>
  <!-- Estilos globales -->
  <link rel="stylesheet" href="styles.css">
  <!-- Firebase y Firestore -->
  <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-auth-compat.js"></script>
  <script src="firebase-config.js"></script>
</head>
<body>
  <div class="game-container">
    <!-- Encabezado del jugador (igual que en lobby) -->
    <header class="player-header">
      <div class="player-info">
        <span id="player-name">Cargando...</span>
        <button id="edit-name-btn" class="edit-btn" title="Editar nombre">✏️</button>
      </div>
      <div class="player-stats">
        <span>Nivel: <span id="player-level">1</span></span>
        <span>Monedas: <span id="player-coins">0</span></span>
        <span>Región: <span id="player-region">Aldea del Factor Común</span></span>
      </div>
      <div class="xp-bar-container">
        <div id="xp-bar-fill" style="width:0%"></div>
        <span id="xp-text">0 / 100 XP</span>
      </div>
      <div class="streak-container">
        <span>🔥 Racha: <span id="racha-actual">0</span></span>
      </div>
    </header>

    <!-- Contenido del juego -->
    <main class="game-content">
      <h2 id="pregunta-enunciado">Factoriza: ...</h2>
      <div id="opciones-container" class="opciones-grid">
        <!-- Los botones de opciones se generan dinámicamente -->
      </div>
      <div id="feedback-message" class="hidden"></div>
      <button id="volver-lobby" class="rpg-button secundario">Volver al Lobby</button>
    </main>
  </div>

  <!-- Scripts -->
  <script src="common.js"></script>
  <script src="factorizados.js"></script>
</body>
</html>
