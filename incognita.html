<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Matejuegos - ¿Dónde está la incógnita?</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=Roboto:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <main class="quest-container" style="max-width: 500px;">
        <section class="game-card">
            <header class="player-header">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
                    <a href="lobby.html" class="back-button" style="color: #94a3b8; text-decoration: none; font-size: 0.9rem;">← Volver</a>
                    <h1 class="game-title" style="font-size: 1.5rem; margin: 0;">🔍 ¿Dónde está la incógnita?</h1>
                    <div style="width: 60px;"></div>
                </div>
                <div class="player-info">
                    <span id="player-name" class="player-name">Jugador</span>
                    <span class="player-level">⭐ <span id="player-score">0</span> pts</span>
                </div>
                <div style="display: flex; gap: 8px; justify-content: center; margin: 6px 0 10px 0; flex-wrap: wrap;">
                    <button id="btn-edit-name" class="rpg-button" style="padding: 4px 14px; font-size: 0.75rem; width: auto; background: linear-gradient(135deg, #fbbf24, #b45309);">✏️ Nombre</button>
                    <button id="btn-logout" class="rpg-button" style="padding: 4px 14px; font-size: 0.75rem; width: auto; background: linear-gradient(135deg, #ef4444, #b91c1c); color: #fff;">🚪 Salir</button>
                </div>
            </header>

            <!-- Selector de modo -->
            <div class="mode-selector">
                <button id="mode-alternativas" class="active">📝 Alternativas</button>
                <button id="mode-practica">✋ Práctica paso a paso</button>
            </div>

            <!-- Modo Alternativas -->
            <div id="modo-alternativas" class="question-area">
                <p id="pregunta-enunciado-alt" class="question-text">Cargando pregunta...</p>
                <div id="opciones-container-alt" class="options-container"></div>
                <div id="feedback-message-alt" class="feedback hidden"></div>
                <div class="streak">
                    Racha: <span id="racha-actual-alt">0</span>
                </div>
            </div>

            <!-- Modo Práctica paso a paso -->
            <div id="modo-practica" style="display: none;">
                <div class="practica-container">
                    <!-- Instrucción -->
                    <p class="hint-text" style="text-align:center; margin-bottom: 10px;">
                        Aplica la operación correcta a ambos lados de la ecuación para despejar la incógnita.
                    </p>

                    <!-- Historial de pasos -->
                    <div id="historial-pasos" class="ecuacion-display">
                        <!-- Aquí se mostrarán todos los pasos: original, operación aplicada, simplificación, etc. -->
                    </div>

                    <!-- Controles -->
                    <div id="controles-practica" class="practica-controles">
                        <p class="hint-text">Elige la operación y el número para aplicar a ambos lados:</p>
                        <div class="operacion-botones">
                            <button class="rpg-button operacion-btn" data-op="sumar">+</button>
                            <button class="rpg-button operacion-btn" data-op="restar">−</button>
                            <button class="rpg-button operacion-btn" data-op="multiplicar">×</button>
                            <button class="rpg-button operacion-btn" data-op="dividir">÷</button>
                        </div>
                        <div class="numero-input">
                            <input type="number" id="numero-practica" placeholder="Número" value="1" step="1">
                            <button id="btn-accion" class="rpg-button primary" disabled>Operar</button>
                        </div>
                    </div>

                    <!-- Mensaje de éxito -->
                    <div id="mensaje-exito" style="display: none; text-align: center; margin: 1rem 0;">
                        <p style="font-size: 1.4rem; color: #22c55e; font-weight: bold;">🎉 ¡Felicidades! Has descubierto la incógnita:</p>
                        <p id="texto-solucion" style="font-size: 2rem; color: #fbbf24; font-family: 'Times New Roman', serif;"></p>
                    </div>

                    <div id="feedback-practica" class="feedback hidden"></div>
                    <button id="next-practica-btn" class="rpg-button" style="width: auto; padding: 10px 30px; margin: 10px auto; display: none; background: linear-gradient(135deg, #22c55e, #15803d); color: #fff;">Siguiente ecuación →</button>
                </div>
            </div>
        </section>
    </main>

    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
    <script src="firebase-config.js"></script>
    <script src="common.js"></script>
    <script src="incognita.js"></script>
</body>
</html>
