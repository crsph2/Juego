<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Matejuegos - ¿Dónde está la incógnita?</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=Roboto:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <style>
        /* Estilos específicos para el modo arrastrar */
        .drag-workspace {
            background: #0f172a;
            border: 2px solid #334155;
            border-radius: 12px;
            padding: 20px;
            min-height: 200px;
            margin: 15px 0;
            position: relative;
        }
        .equation-display {
            font-size: 2rem;
            font-family: 'Cinzel', serif;
            color: #f8fafc;
            text-align: center;
            padding: 20px;
            min-height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
        }
        .equation-display .slot {
            display: inline-block;
            min-width: 50px;
            min-height: 50px;
            border: 2px dashed #64748b;
            border-radius: 8px;
            padding: 5px 10px;
            background: #1e293b;
            color: #fbbf24;
            font-weight: bold;
            font-size: 1.5rem;
            text-align: center;
            transition: all 0.3s;
        }
        .equation-display .slot.filled {
            border-color: #22c55e;
            background: #1a3a2a;
        }
        .equation-display .slot.drag-over {
            border-color: #fbbf24;
            background: #2a2a3a;
            transform: scale(1.05);
        }
        .number-pool {
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
            padding: 15px;
            background: #1e293b;
            border-radius: 10px;
            margin: 10px 0;
        }
        .number-tile {
            width: 60px;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            font-weight: bold;
            background: linear-gradient(135deg, #fbbf24, #b45309);
            color: #0f172a;
            border-radius: 10px;
            cursor: grab;
            user-select: none;
            transition: transform 0.2s;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        .number-tile:hover {
            transform: scale(1.05);
        }
        .number-tile:active {
            cursor: grabbing;
        }
        .number-tile.placed {
            opacity: 0.4;
            pointer-events: none;
        }
        .mode-selector {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-bottom: 15px;
        }
        .mode-selector button {
            padding: 8px 20px;
            border: 2px solid #334155;
            border-radius: 8px;
            background: transparent;
            color: #94a3b8;
            cursor: pointer;
            font-family: 'Cinzel', serif;
            transition: all 0.3s;
        }
        .mode-selector button.active {
            border-color: #fbbf24;
            color: #fbbf24;
            background: rgba(251, 191, 36, 0.1);
        }
        .mode-selector button:hover {
            border-color: #fbbf24;
            color: #f8fafc;
        }
        .check-btn {
            margin-top: 15px;
            padding: 12px 30px;
            font-size: 1.1rem;
        }
        .feedback-drag {
            margin-top: 10px;
            padding: 10px;
            border-radius: 8px;
            text-align: center;
            font-weight: 500;
        }
        .feedback-drag.success {
            background: rgba(34, 197, 94, 0.2);
            color: #86efac;
        }
        .feedback-drag.error {
            background: rgba(239, 68, 68, 0.2);
            color: #fca5a5;
        }
        .hint-text {
            color: #94a3b8;
            font-size: 0.85rem;
            text-align: center;
            margin: 10px 0;
        }
        @media (max-width: 480px) {
            .equation-display {
                font-size: 1.3rem;
                padding: 10px;
            }
            .equation-display .slot {
                min-width: 35px;
                min-height: 35px;
                font-size: 1rem;
                padding: 3px 6px;
            }
            .number-tile {
                width: 45px;
                height: 45px;
                font-size: 1.1rem;
            }
        }
    </style>
</head>
<body>
    <main class="quest-container" style="max-width: 500px;">
        <section class="game-card">
            <header class="player-header">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
                    <a href="lobby.html" class="back-button" style="color: #94a3b8; text-decoration: none; font-size: 0.9rem;">← Volver</a>
                    <h1 class="game-title" style="font-size: 1.5rem; margin: 0;">🔍 ¿Dónde está la incógnita?</h1>
                    <div style="width: 60px;"></div>
                </div>
                <div class="player-info">
                    <span id="player-name" class="player-name">Jugador</span>
                    <span class="player-level">⭐ <span id="player-score">0</span> pts</span>
                </div>
                <div style="display: flex; gap: 8px; justify-content: center; margin: 6px 0 10px 0; flex-wrap: wrap;">
                    <button id="btn-logout" class="rpg-button" style="padding: 4px 14px; font-size: 0.75rem; width: auto; background: linear-gradient(135deg, #ef4444, #b91c1c); color: #fff;">🚪 Salir</button>
                </div>
            </header>

            <!-- Selector de modo -->
            <div class="mode-selector">
                <button id="mode-alternativas" class="active">📝 Alternativas</button>
                <button id="mode-arrastrar">✋ Arrastrar</button>
            </div>

            <!-- Modo Alternativas -->
            <div id="modo-alternativas" class="question-area">
                <p id="pregunta-enunciado-alt" class="question-text">Cargando pregunta...</p>
                <div id="opciones-container-alt" class="options-container"></div>
                <div id="feedback-message-alt" class="feedback hidden"></div>
                <div class="streak">
                    Racha: <span id="racha-actual-alt">0</span>
                </div>
            </div>

            <!-- Modo Arrastrar -->
            <div id="modo-arrastrar" style="display: none;">
                <p class="hint-text">Arrastra los números a los espacios vacíos para resolver la ecuación</p>
                
                <div class="drag-workspace">
                    <div id="equation-display" class="equation-display">
                        <!-- Se genera dinámicamente -->
                    </div>
                </div>

                <div id="number-pool" class="number-pool">
                    <!-- Se genera dinámicamente -->
                </div>

                <button id="check-drag-btn" class="rpg-button check-btn" style="width: auto; padding: 10px 30px; margin: 0 auto; display: block;">✓ Verificar</button>
                <div id="feedback-drag" class="feedback-drag"></div>
                <button id="next-drag-btn" class="rpg-button" style="width: auto; padding: 10px 30px; margin: 10px auto; display: none; background: linear-gradient(135deg, #22c55e, #15803d); color: #fff;">Siguiente pregunta →</button>
            </div>
        </section>
    </main>

    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
    <script src="firebase-config.js"></script>
    <script src="incognita.js"></script>
</body>
</html>
