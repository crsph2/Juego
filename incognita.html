<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Matejuegos - ¿Dónde está la incógnita?</title>
    <link rel="stylesheet" href="styles.css" />
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600&family=Roboto:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="quest-container">
        <div class="game-card">

            <!-- Cabecera -->
            <div class="lobby-header">
                <div class="player-info">
                    <span id="player-name">Trotamundos</span>
                    <button id="edit-name-btn" class="btn-icon" title="Editar nombre">✏️</button>
                    <span class="xp-display">⭐ <span id="player-xp">0</span> XP</span>
                </div>
                <div style="display: flex; gap: 0.5rem;">
                    <button id="btn-save" class="btn btn-secondary" style="padding: 0.4rem 1rem; font-size: 0.8rem;">Guardar</button>
                    <button id="btn-exit" class="btn btn-danger" style="padding: 0.4rem 1rem; font-size: 0.8rem;">Salir</button>
                </div>
            </div>

            <h2 class="game-title">❓ ¿DÓNDE ESTÁ LA INCÓGNITA?</h2>
            <p class="subtitle">Resuelve la ecuación eligiendo la solución correcta</p>

            <!-- Ejercicio -->
            <div class="exercise-container">
                <span class="exercise-label">Resuelve:</span>
                <div class="exercise-text" id="exercise-text">2x + 3 = 7</div>
            </div>

            <!-- Opciones 2×2 -->
            <div class="options-grid" id="options-container">
                <button class="option-btn" data-index="0">x = 1</button>
                <button class="option-btn" data-index="1">x = 2</button>
                <button class="option-btn" data-index="2">x = 3</button>
                <button class="option-btn" data-index="3">x = 4</button>
            </div>

            <!-- Racha y feedback -->
            <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 1rem;">
                <span style="color: #94a3b8;">Racha: <span id="streak">0</span></span>
                <div id="feedback-message" class="hidden"></div>
            </div>

        </div>
    </div>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
    <script src="firebase-config.js"></script>
    <script src="common.js"></script>
    <script src="incognita.js"></script>
</body>
</html>
