<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>Matejuegos - Operación: Sistema</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container sistemas-container">
        <header class="player-header" style="margin-bottom:0.5rem;">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px;">
                <a href="lobby.html" class="back-button">← Volver</a>
                <h1 style="font-size:1.2rem; margin:0; color:var(--btn-primary);">💣 Operación: Sistema</h1>
                <div style="width:60px;"></div>
            </div>
            <div class="player-info">
                <span id="player-name" class="player-name">Aventurero</span>
                <span class="player-level">Nivel <span id="player-level">1</span></span>
                <span class="player-coins">🪙 <span id="player-coins">0</span></span>
                <button id="theme-toggle" class="theme-toggle" title="Cambiar modo claro/oscuro">🌙</button>
            </div>
            <div style="display:flex; gap:6px; justify-content:center; flex-wrap:wrap; margin:4px 0 8px;">
                <button id="btn-edit-name" class="rpg-button btn-gold" style="padding:4px 12px; font-size:0.7rem;">✏️ Nombre</button>
                <button id="btn-logout" class="rpg-button btn-danger" style="padding:4px 12px; font-size:0.7rem;">🚪 Salir</button>
                <button id="btn-reset-game" class="rpg-button btn-secondary" style="padding:4px 12px; font-size:0.7rem;">🔄 Reiniciar</button>
            </div>
            <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:4px;">
                <div class="xp-bar" style="height:18px; flex:1; min-width:100px;">
                    <div id="xp-bar-fill" class="xp-bar-fill" style="width:0%;"></div>
                    <span id="xp-text" class="xp-text" style="font-size:0.7rem;">0 / 100 XP</span>
                </div>
                <span style="background: #1565c0; color: #fff; padding: 0.1rem 0.8rem; border-radius: 20px; font-weight: bold; font-size:0.8rem;">
                    🏆 <span id="misiones-contador">0</span>
                </span>
                <span style="background: #2e7d32; color: #fff; padding: 0.1rem 0.8rem; border-radius: 20px; font-weight: bold; font-size:0.8rem;">
                    ✅ <span id="aciertos-contador">0</span>
                </span>
            </div>
            <div class="region-info">
                <span id="player-region">Misión: Sistemas</span>
            </div>
            <div id="avatar-display" class="avatar-display" style="min-height:140px;"></div>
        </header>

        <div id="game-screen"></div>
        <div id="feedback-message" class="feedback hidden"></div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
    <script src="firebase-config.js"></script>
    <script src="common.js"></script>
    <script src="sistemas.js"></script>
</body>
</html>
