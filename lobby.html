<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MathQuest - Lobby</title>
  <!-- Estilos globales -->
  <link rel="stylesheet" href="styles.css">
  <!-- Firebase y Firestore -->
  <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-auth-compat.js"></script>
  <script src="firebase-config.js"></script>
</head>
<body>
  <div class="game-container">
    <!-- Encabezado del jugador -->
    <header class="player-header">
      <div class="player-info">
        <span id="player-name">Cargando...</span>
        <button id="edit-name-btn" class="edit-btn" title="Editar nombre">✏️</button>
      </div>
      <div class="player-stats">
        <span>Nivel: <span id="player-level">1</span></span>
        <span>Monedas: <span id="player-coins">0</span></span>
        <span>Región: <span id="player-region">Aldea del Factor Común</span></span>
      </div>
      <div class="xp-bar-container">
        <div id="xp-bar-fill" style="width:0%"></div>
        <span id="xp-text">0 / 100 XP</span>
      </div>
    </header>

    <!-- Contenido del lobby -->
    <main class="lobby-content">
      <h1>🏰 Vestíbulo del Aventurero</h1>
      <p>Elige un desafío para continuar tu viaje</p>

      <div class="game-cards">
        <div class="game-card" id="btn-factorizacion">
          <h2>🔢 Factorización</h2>
          <p>Domina el arte de descomponer polinomios</p>
          <button class="rpg-button">Jugar</button>
        </div>
        <div class="game-card" id="btn-incognita">
          <h2>❓ La Incógnita</h2>
          <p>Resuelve ecuaciones y encuentra el valor de x</p>
          <button class="rpg-button">Jugar</button>
        </div>
        <!-- Agrega más juegos aquí -->
      </div>
    </main>

    <!-- Mensaje de feedback (para el botón de editar nombre) -->
    <div id="feedback-message" class="hidden"></div>
  </div>

  <!-- Scripts -->
  <script src="common.js"></script>
  <script src="lobby.js"></script>
</body>
</html>
