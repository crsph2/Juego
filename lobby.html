<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Matejuegos - Lobby</title>
    <link rel="stylesheet" href="styles.css" />
</head>
<body>
    <div class="container lobby-card">
        <header>
            <div class="player-info">
                <span id="player-name">Trotamundos</span>
                <button id="edit-name-btn" class="btn-icon" title="Editar nombre">✏️</button>
                <span class="xp">⭐ <span id="player-xp">0</span> XP</span>
                <span class="coins">🪙 <span id="player-coins">0</span></span>
            </div>
            <div id="avatar-display" class="avatar-display"></div>
            <button id="btn-logout" class="btn btn-danger" style="margin-top:8px;">Cerrar sesión</button>
        </header>

        <div id="feedback-message" class="hidden"></div>

        <h2>🏰 Elige tu aventura</h2>
        <div class="game-cards">
            <div class="card">
                <div class="card-icon">🧮</div>
                <h3>Factorizados</h3>
                <p>Factoriza expresiones algebraicas y sube de nivel</p>
                <span class="badge">Álgebra</span>
                <button class="btn btn-primary" id="btn-factorizados">Jugar</button>
            </div>
            <div class="card">
                <div class="card-icon">🔍</div>
                <h3>¿Dónde está la incógnita?</h3>
                <p>Resuelve ecuaciones lineales de dos formas diferentes</p>
                <span class="badge">Ecuaciones</span>
                <button class="btn btn-primary" id="btn-incognita">Jugar</button>
            </div>
        </div>

        <!-- TIENDA (sin cambios) -->
        ...
    </div>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
    <script src="firebase-config.js"></script>
    <script src="common.js"></script>
    <script src="lobby.js"></script>
</body>
</html>
